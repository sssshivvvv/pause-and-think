### model
model_name_or_path: Qwen/Qwen3-VL-4B-Instruct # previously was Qwen/Qwen3-VL-2B-Instruct
# image_max_pixels: 1048576   # ~1024x1024
video_max_pixels: 400000
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true # did false -> true, for second iteration of succesful training. /home/q3vl_llamafactory/LlamaFactory/saves/full/full_sft_3_epochs_frozen_vit
freeze_multi_modal_projector: true 
freeze_language_model: false
deepspeed: /data/shivsing/q3vl_training/q3vl_llamafactory/LlamaFactory/examples/deepspeed/ds_z2_config.json

### dataset
dataset: TW_full_data_training
# eval_dataset: TW_full_data_eval
template: qwen3_vl_nothink
cutoff_len: 128000
max_samples: 10000000
overwrite_cache: true
preprocessing_num_workers: 64
dataloader_num_workers: 16

### output
output_dir: /data/shivsing/q3vl_training/q3vl_llamafactory/LlamaFactory/saves/full/full_sft_q3vl4b_frozen_vit_and_projector_128000_again
logging_steps: 10
save_steps: 50
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb  

### train
per_device_train_batch_size: 4  #8 gave 0 Loss so falling back to 4
gradient_accumulation_steps: 2
learning_rate: 1.0e-5 #2.0e-5 gave 0 loss so falling back to 1.0e-5
num_train_epochs: 5.0 #falling backk to 3 from 5; phirse 5 kar dia q3vl4b ke lie
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: false # enabling fp16 coz bf16 is giving zero loss
fp16: true # enabling fp16 coz bf16 is giving zero loss
ddp_timeout: 180000000
resume_from_checkpoint: null
max_grad_norm: 1.0 # falling back to 1.0 from 10
gradient_checkpointing: true

## eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50

